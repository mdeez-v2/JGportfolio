<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>John</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #1c1917;
      color: #f5f5f4;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    img {
      display: block;
      max-width: min(100%, 720px);
      max-height: calc(100vh - 48px);
      width: auto;
      height: auto;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <img src="john.png" alt="John lying on a kitchen floor">
</body>
</html>
