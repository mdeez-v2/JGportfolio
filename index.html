<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>John</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: #1c1917;
      color: #f5f5f4;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
    }
    h1 {
      margin: 0 0 24px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(48px, 8vw, 96px);
      font-weight: 700;
      letter-spacing: 0.12em;
      line-height: 1;
    }
    img {
      display: block;
      max-width: min(100%, 720px);
      max-height: calc(100vh - 200px);
      width: auto;
      height: auto;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <h1>JOHN</h1>
  <img src="john.png" alt="John lying on a kitchen floor">
</body>
</html>
